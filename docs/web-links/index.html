<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Open in Mirall</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1d1b17;
      --muted: #5f5a52;
      --accent: #ff8c42;
      --accent-text: #1d1b17;
      --outline: #d8d3ca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #1f2227;
        --text: #f4ecdf;
        --muted: #b3aca0;
        --accent: #ff8c42;
        --accent-text: #1d1b17;
        --outline: #3a3e46;
      }
    }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 28rem; margin: 10vh auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--outline); border-radius: 20px; padding: 32px; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; overflow-wrap: anywhere; }
    p { margin: 0 0 20px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .actions:empty { display: none; }
    a.button, button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--outline); background: transparent; color: var(--text); text-decoration: none; cursor: pointer; }
    .primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    a.button:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1 id="title">Open in Mirall</h1>
      <p id="lead" aria-live="polite"></p>
      <div id="actions" class="actions"></div>
      <noscript><p>Turn on JavaScript to open this link in Mirall, or <a href="https://mirall.app/download">download Mirall</a>.</p></noscript>
    </div>
  </main>
  <script>
    'use strict'
    const DOWNLOAD_URL = 'https://mirall.app/download'
    const LAUNCH_WINDOW_MS = 2500
    const EXPIRY_GRACE_MS = 60000

    /* payload-checks:start */
    // What each kind of link carries. The payload is passed to the app verbatim; the checks
    // only decide whether to try the app link at all. test/unit/web-links-sample.test.js runs
    // this block against the app's own vectors, so a grammar change fails CI.
    const KINDS = {
      space: { appHost: 'join', title: 'Join a space', description: 'Open this invite in Mirall to join the space.', check: isInviteCode },
      relay: { appHost: 'relay', title: 'Add a relay', description: 'Open this invite in Mirall to add the relay.', check: isRelayTicket },
      license: { appHost: 'license', title: 'Set up your license', description: 'Open this link in Mirall to confirm your license key.', check: isLicensePayload },
    }
    const HEX64 = /^[0-9a-f]{64}$/i
    const B64URL = /^[A-Za-z0-9_-]+$/
    const Z_BASE_32_TICKET = /^[ybndrfg8ejkmcpqxot1uwisza345h769]{111}$/
    const LICENSE_KEY = /^k\/MRL(-[0-9A-Z]{5}){5}$/

    // A v0 invite is 64 hex characters, dashes allowed; a v1 invite is base64url JSON with the
    // 64-hex topic in `t`. Name and expiry are hints for this page only; the app decides.
    function decodeInvite(code) {
      const hex = code.replace(/-/g, '')
      if (HEX64.test(hex)) return { topic: hex.toLowerCase(), name: null, expiresAt: null }
      if (!B64URL.test(code)) return null
      try {
        const padded = code.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - code.length % 4) % 4)
        const bytes = Uint8Array.from(atob(padded), (ch) => ch.charCodeAt(0))
        const env = JSON.parse(new TextDecoder().decode(bytes))
        if (env.v !== 1 || typeof env.t !== 'string' || !HEX64.test(env.t)) return null
        return {
          topic: env.t.toLowerCase(),
          name: typeof env.n === 'string' && env.n.length > 0 ? env.n.slice(0, 80) : null,
          expiresAt: Number.isInteger(env.x) && env.x > 0 ? env.x : null,
        }
      } catch {
        return null
      }
    }
    function isInviteCode(payload) { return decodeInvite(payload) !== null }
    function isRelayTicket(payload) { return Z_BASE_32_TICKET.test(payload.toLowerCase()) }
    function isLicensePayload(payload) { return LICENSE_KEY.test(payload) }
    /* payload-checks:end */

    const LEAD = {
      attempting: 'Opening Mirall… Your browser may ask for permission to open it.',
      opened: 'Opened in Mirall. You can close this tab.',
      unconfirmed: "Didn't open? Mirall may not be installed. After installing, open Mirall once, then come back and click Open in Mirall.",
      unsupported: 'Mirall runs on Mac, Windows and Linux. Open this link on your computer.',
      incomplete: 'This link is incomplete. Ask for it again, or paste the code into Mirall.',
      expired: 'This invite has expired. Ask whoever sent it for a new one.',
      unknown: 'This link is not recognised. It may be incomplete, or meant for a newer version of Mirall.',
    }

    function kindFromPath(pathname) {
      const id = pathname.replace(/\/+$/, '').split('/').pop()
      return Object.prototype.hasOwnProperty.call(KINDS, id) ? { id, ...KINDS[id] } : null
    }
    function readFragment() {
      const raw = window.location.hash.slice(1)
      try { return decodeURIComponent(raw) } catch { return raw }
    }
    function isDesktop() {
      if (/Android|iPhone|iPad|iPod|Mobile|Tablet/i.test(navigator.userAgent)) return false
      return !(/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)
    }

    const title = document.getElementById('title')
    const lead = document.getElementById('lead')
    const actions = document.getElementById('actions')

    function button(label, { href, primary, onClick }) {
      const el = document.createElement(href ? 'a' : 'button')
      if (href) el.href = href; else el.type = 'button'
      el.className = (href ? 'button' : '') + (primary ? ' primary' : '')
      el.textContent = label
      if (onClick) el.addEventListener('click', onClick)
      return el
    }

    const kind = kindFromPath(window.location.pathname)
    const payload = readFragment()
    const invite = kind && kind.id === 'space' && kind.check(payload) ? decodeInvite(payload) : null
    const appUrl = kind ? `mirall://${kind.appHost}/${payload}` : ''
    let timer = null

    function render(state) {
      lead.textContent = LEAD[state] || ''
      actions.replaceChildren()
      const open = button(state === 'opened' ? 'Open again' : 'Open in Mirall', {
        href: appUrl, primary: state === 'attempting', onClick: (e) => { e.preventDefault(); attempt() },
      })
      const download = button('Download Mirall', { href: DOWNLOAD_URL, primary: state === 'unconfirmed' })
      if (state === 'attempting') actions.append(open, download)
      if (state === 'opened') actions.append(open)
      if (state === 'unconfirmed') { actions.append(download, open); download.focus() }
      if (state === 'incomplete' || state === 'unknown') actions.append(download)
      if (state === 'unsupported') {
        actions.append(button('Copy link', { onClick: async () => {
          await navigator.clipboard.writeText(window.location.href)
          lead.textContent = 'Link copied. Open it on your computer.'
        } }))
      }
    }

    // The hand-off. No browser says whether a scheme handler exists: the page navigates to the
    // app link and reads losing focus or visibility within the window as "the app took it". A
    // timeout is "unconfirmed", never "not installed"; the page never redirects on its own.
    function attempt() {
      render('attempting')
      const left = () => { cleanup(); render('opened') }
      const onVisibility = () => { if (document.visibilityState === 'hidden') left() }
      function cleanup() {
        window.removeEventListener('blur', left)
        window.removeEventListener('pagehide', left)
        document.removeEventListener('visibilitychange', onVisibility)
        clearTimeout(timer)
      }
      window.addEventListener('blur', left)
      window.addEventListener('pagehide', left)
      document.addEventListener('visibilitychange', onVisibility)
      timer = setTimeout(() => { cleanup(); render('unconfirmed') }, LAUNCH_WINDOW_MS)
      window.location.assign(appUrl)
    }

    if (!kind) {
      title.textContent = 'This link is not recognised'
      render('unknown')
    } else {
      title.textContent = invite && invite.name ? `Join “${invite.name}”` : kind.title
      document.title = `${kind.title} · Mirall`
      if (!kind.check(payload)) render('incomplete')
      else if (invite && invite.expiresAt !== null && Date.now() > invite.expiresAt + EXPIRY_GRACE_MS) render('expired')
      else if (!isDesktop()) render('unsupported')
      else attempt()
    }
  </script>
</body>
</html>
