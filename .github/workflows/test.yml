name: Test

on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  # Tier 1 pure units + raw holepunch mechanics. Fast; has never flaked.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      # a11y rules are errors (hard gate); complexity/unused-vars warnings are held at a
      # baseline ceiling so NEW hotspots fail CI without blocking on existing debt. Ratchet
      # the --max-warnings number in package.json down as the worst offenders get refactored.
      - name: Lint (a11y gate + complexity/unused-vars ceiling)
        run: npm run lint:ci
      # Dead-code report. Advisory for now: knip exits non-zero on the ~50 existing unused
      # exports (some intentionally exported for future use), so it surfaces in the log without
      # failing the job. Drop continue-on-error once the baseline is cleaned to make it a gate.
      - name: Dead-code report (knip — advisory)
        run: npm run knip
        continue-on-error: true
      - name: Tests (unit + raw)
        run: npm run test:node:core

  # Tier 3 two-peer flow tests: real worker subprocesses over a hermetic hyperdht
  # testnet. They measure CPU-bound eventual-consistency convergence and are ~5x
  # slower on a 2-vCPU runner — hence MIRALL_TEST_TIMEOUT_SCALE. Sharded so one
  # flake fails only its shard (re-run it) and the suite parallelises. bare-sidecar
  # bundles its own `bare`, so no PATH step is needed here.
  flow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      MIRALL_TEST_TIMEOUT_SCALE: '3'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Flow tests (shard ${{ matrix.shard }}/6)
        run: |
          files="$(node test/flow-shard.mjs ${{ matrix.shard }} 6)"
          echo "Shard ${{ matrix.shard }}/6:"; echo "$files" | tr ' ' '\n'
          mkdir -p flake-report/logs
          # Run each file independently so one file's crash can't abort the rest,
          # then retry ONLY the failed files once (a whole-shard retry wasted minutes).
          # The FIRST attempt's output is kept for anything that failed: a flake that only
          # reproduces in CI cannot be diagnosed after the fact from a ::warning, and the
          # warning text itself used to point at diagnostics nothing was saving.
          failed=""
          for f in $files; do
            log="flake-report/logs/$(echo "$f" | tr '/' '_').log"
            if npx brittle-node "$f" >"$log" 2>&1; then rm -f "$log"; else cat "$log"; failed="$failed $f"; fi
          done
          entries=""
          status=0
          if [ -n "$failed" ]; then
            echo "::warning title=Flow shard ${{ matrix.shard }} flaked::retried$failed (a pass-on-retry is a residual flake — the failed attempt's output is in the flake-report artifact)"
            for f in $failed; do
              if npx brittle-node "$f"; then passed=true; else passed=false; status=1; fi
              entries="$entries{\"file\":\"$f\",\"attempts\":2,\"passedOnRetry\":$passed},"
            done
          fi
          printf '{"shard":%s,"files":[%s]}\n' "${{ matrix.shard }}" "${entries%,}" > flake-report/flake-${{ matrix.shard }}.json
          { echo "### Flow shard ${{ matrix.shard }}/6"; if [ -z "$failed" ]; then echo "No retries."; else echo "Retried:$failed"; fi; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-report-${{ matrix.shard }}
          path: flake-report
          if-no-files-found: ignore

  # A pass-on-retry used to leave a ::warning and nothing else: annotation-only, nothing aggregates
  # it, so nobody could tell an improving suite from a decaying one. This is the gate for
  # FLAKINESS, deliberately separate from the shard jobs so a genuine hard failure stays an
  # immediate shard red and can never be mistaken for a budget overrun.
  flake-ledger:
    runs-on: ubuntu-latest
    needs: flow
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: flake-report-*
          path: flake-reports
          merge-multiple: true
      - name: Flake budget
        run: node scripts/flake-ledger.mjs flake-reports test/flow-flake-budget.json

  # Tier 2/3 in-process tests of the real bare-* modules. brittle-bare shells
  # out to a `bare` binary on PATH (provided by the bare-runtime devDep).
  bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure bare runtime on PATH
        run: |
          # npm ci normally links node_modules/.bin/bare from the bare-runtime
          # devDep; create it defensively if missing, then verify it runs.
          if [ ! -e node_modules/.bin/bare ]; then
            ln -sf ../bare-runtime/bin/bare node_modules/.bin/bare
          fi
          node_modules/.bin/bare --version
      - name: Tests (bare runner)
        run: npm run test:bare
