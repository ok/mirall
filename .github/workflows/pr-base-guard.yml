name: PR Base Guard

# Development happens on `main`; each `release/x.y` branch holds one shipped
# release line and only takes fixes that already landed on `main`. A feature PR
# aimed at a release branch would ship unreleased work in the next patch. This
# guard catches it. See .claude/build-process.md → "Branches & releases".
on:
  pull_request:
    # `edited` catches a base switched after the PR was opened; the label events
    # re-run the check when the bypass label is added or removed.
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]
    branches: ['release/**']

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Check head branch may target a release branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | jq -e 'index("base:release")' >/dev/null; then
            echo "Bypassed by the \`base:release\` label — deliberate exception."
            exit 0
          fi
          # Allowlist, not denylist: a branch prefix nobody thought about should
          # fail closed and get a human decision, not slip into a release.
          case "$HEAD_REF" in
            backport/*)     echo "Backport of a fix merged to main — OK" ;;
            hotfix/*)       echo "Hotfix — OK (remember to forward-port to main)" ;;
            release-prep/*) echo "Release prep — OK (forward-port the changelog to main)" ;;
            *)
              echo "::error::'$HEAD_REF' targets a release branch, but feature and fix work lands on main."
              echo ""
              echo "Retarget this PR:  gh pr edit ${{ github.event.pull_request.number }} --base main"
              echo ""
              echo "Only 'backport/*', 'hotfix/*' and 'release-prep/*' may target a release branch."
              echo "For a deliberate exception, add the 'base:release' label and explain why in the PR body."
              exit 1
              ;;
          esac
