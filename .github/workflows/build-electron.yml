name: Build Electron

# Runs automatically on a v* tag push (the prod channel); can also be dispatched
# manually from the Actions tab (or `gh workflow run build-electron.yml`) to build
# a single dev or staging channel and platform. Prod is never dispatched.
#
# Values from expressions reach `run:` scripts only through `env:`, never pasted
# into the script text, so a ref or input name cannot inject shell or JS.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (prod is built only from a v* tag push)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
      platform:
        description: 'Platform to build (all = full matrix)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - darwin-x64
          - darwin-arm64
          - linux-x64
          - linux-arm64
          - win32-x64

# Builds read the repo and write only to R2 and the run's artifacts.
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.ch.outputs.channel }}
      version: ${{ steps.ver.outputs.version }}
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: ch
        env:
          EVENT: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          # Prod comes only from a v* tag push; a dispatch picks a non-prod channel.
          # Reaching the fallback means a trigger was added without deciding its
          # channel — fail loudly rather than guess.
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            CHANNEL="prod"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_CHANNEL" in
              dev|staging) CHANNEL="$INPUT_CHANNEL" ;;
              *)
                echo "::error::Channel '$INPUT_CHANNEL' cannot be dispatched; prod is built only from a v* tag push."
                exit 1
                ;;
            esac
          else
            echo "::error::No channel for ref '$GITHUB_REF' (event $EVENT); add an arm here or dispatch manually."
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Channel: $CHANNEL"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release-branch check below walks history and needs the branches.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag format and release branch
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # A release tag names a documented version and sits on its
          # release/<major>.<minor> branch, whose history cannot be rewritten.
          TAG="$GITHUB_REF_NAME"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+(-[a-z]+[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not v<MAJOR>.<MINOR>.<PATCH>[-<label><N>]"
            exit 1
          fi
          LINE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/release/$LINE"; then
            echo "::error::$TAG ($GITHUB_SHA) is not on release/$LINE"
            exit 1
          fi
          echo "$TAG is on release/$LINE"
      - id: ver
        env:
          CHANNEL: ${{ steps.ch.outputs.channel }}
        run: |
          if [ "$CHANNEL" = "prod" ]; then
            # Tagged release — the version comes from the tag.
            V="${GITHUB_REF_NAME#v}"
          else
            # Non-prod channels: append a label + run number so each CI build
            # is unique and the channel is visible in the version string. The
            # staging channel ships publicly as the "beta" download (website
            # /preview), so it gets a `-beta.N` label; the channel id stays
            # `staging` everywhere else (R2 path, secrets, signing, seeder).
            BASE=$(node -p "require('./package.json').version")
            case "$CHANNEL" in
              staging) LABEL="beta" ;;
              *)       LABEL="$CHANNEL" ;;
            esac
            V="$BASE-$LABEL.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"
      - name: Verify tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG_V="${GITHUB_REF_NAME#v}"
          PKG_V=$(node -p "require('./package.json').version")
          if [ "$TAG_V" != "$PKG_V" ]; then
            echo "::error::Tag v$TAG_V does not match package.json version $PKG_V"
            echo "Bump package.json#version to $TAG_V (or retag) and rerun."
            exit 1
          fi
          echo "Tag and package.json agree on $TAG_V"
      - name: Verify CHANGELOG.md has an entry for this tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG_V="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md is missing; add it with a '## v$TAG_V' entry."
            exit 1
          fi
          TOP=$(grep -m1 -E '^## v[0-9]' CHANGELOG.md | sed -E 's/^## v([^[:space:]]+).*/\1/')
          if [ -z "$TOP" ]; then
            echo "::error::CHANGELOG.md has no version headings; add a '## v$TAG_V' entry."
            exit 1
          fi
          if [ "$TAG_V" != "$TOP" ]; then
            echo "::error::Top of CHANGELOG.md is '## v$TOP' but tag is v$TAG_V"
            echo "Add a '## v$TAG_V' entry above v$TOP, or retag from a commit that has one."
            exit 1
          fi
          echo "CHANGELOG.md top entry agrees with tag: v$TAG_V"
      - id: matrix
        env:
          FILTER: ${{ inputs.platform || 'all' }}
        run: |
          ALL='[
            {"os":"macos-latest","platform":"darwin","arch":"x64","archPath":"darwin-x64","ext":"dmg"},
            {"os":"macos-latest","platform":"darwin","arch":"arm64","archPath":"darwin-arm64","ext":"dmg"},
            {"os":"ubuntu-latest","platform":"linux","arch":"x64","archPath":"linux-x64","ext":"AppImage"},
            {"os":"ubuntu-24.04-arm","platform":"linux","arch":"arm64","archPath":"linux-arm64","ext":"AppImage"},
            {"os":"windows-latest","platform":"win32","arch":"x64","archPath":"win32-x64","ext":"msix"}
          ]'
          if [ "$FILTER" = "all" ]; then
            INCLUDE=$(echo "$ALL" | jq -c .)
          else
            INCLUDE=$(echo "$ALL" | jq -c --arg f "$FILTER" '[.[] | select(.archPath == $f)]')
          fi
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo "Matrix: $INCLUDE"

  build:
    needs: resolve
    # The signing and R2 secrets live only in these environments: `release`
    # accepts v* tags, `beta` accepts main and release/*, and both wait for a
    # reviewer before the job starts.
    environment: ${{ needs.resolve.outputs.channel == 'prod' && 'release' || 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.include) }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.20.0'

      - name: Require release credentials
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          # An environment missing a secret would otherwise build green: the
          # upload would have nowhere to go and macOS signing would turn off.
          MISSING=()
          for NAME in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_ENDPOINT; do
            [ -n "${!NAME}" ] || MISSING+=("$NAME")
          done
          if [ "$PLATFORM" = "darwin" ]; then
            for NAME in APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE_P12; do
              [ -n "${!NAME}" ] || MISSING+=("$NAME")
            done
          fi
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::The build environment is missing: ${MISSING[*]}"
            exit 1
          fi

      - name: Patch package.json version
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          node -e "const p=require('./package.json');p.version=process.env.VERSION;require('fs').writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n')"
          grep '"version"' package.json | head -1

      - name: Resolve UPGRADE_KEY for channel
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          UPGRADE_KEY_DEV: ${{ secrets.UPGRADE_KEY_DEV }}
          UPGRADE_KEY_STAGING: ${{ secrets.UPGRADE_KEY_STAGING }}
          UPGRADE_KEY_PROD: ${{ secrets.UPGRADE_KEY_PROD }}
        run: |
          case "$CHANNEL" in
            dev)     KEY="$UPGRADE_KEY_DEV" ;;
            staging) KEY="$UPGRADE_KEY_STAGING" ;;
            prod)    KEY="$UPGRADE_KEY_PROD" ;;
          esac
          if [ -z "$KEY" ]; then
            echo "::error::UPGRADE_KEY for channel '$CHANNEL' is empty"
            exit 1
          fi
          echo "UPGRADE_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Verify package-lock.json is unchanged
        shell: bash
        run: git diff --exit-code -- package-lock.json

      - name: Build TS + CSS
        run: npm run build

      - name: Make (macOS)
        if: matrix.platform == 'darwin'
        env:
          ARCH: ${{ matrix.arch }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -e
          if [ -n "$APPLE_CERTIFICATE_P12" ]; then
            CERT="$RUNNER_TEMP/cert.p12"
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$CERT" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security find-identity -v -p codesigning "$KEYCHAIN"
            rm -f "$CERT"
          fi
          npm run make:darwin -- --arch="$ARCH"

      - name: Cleanup keychain (macOS)
        if: always() && matrix.platform == 'darwin'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Make (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq squashfs-tools fakeroot
          npm run make:linux

      - name: Make (Windows)
        if: matrix.platform == 'win32'
        shell: bash
        run: npm run make:win32

      - name: Check Electron fuses
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          case "$PLATFORM" in
            darwin) APP="out/Mirall-darwin-$ARCH/Mirall.app" ;;
            linux)  APP="out/Mirall-linux-$ARCH/Mirall" ;;
            win32)  APP="out/Mirall-win32-$ARCH/Mirall.exe" ;;
          esac
          node scripts/ci/check-fuses.mjs "$APP"

      - name: Locate artifact (macOS)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          F=$(find out/make -name '*.dmg' | head -1)
          [ -f "$F" ] || { echo "no dmg found"; ls -la out/make; exit 1; }
          mkdir -p artifact
          cp "$F" artifact/Mirall.dmg
          ls -la artifact/

      - name: Locate artifact (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          F=$(find out/make -name '*.AppImage' | head -1)
          [ -f "$F" ] || { echo "no AppImage found"; ls -la out/make; exit 1; }
          D=$(find out/make/deb -name '*.deb' | head -1)
          [ -f "$D" ] || { echo "no deb found"; find out/make -type f; exit 1; }
          mkdir -p artifact
          cp "$F" artifact/Mirall.AppImage
          chmod +x artifact/Mirall.AppImage
          cp "$D" artifact/Mirall.deb
          ls -la artifact/

      - name: Verify deb (sandbox helper, layout, control)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts/ci/check-deb.sh artifact/Mirall.deb "$ARCH" "$VERSION"

      - name: Locate artifact (Windows)
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          F=$(find out -name '*.msix' | head -1)
          [ -f "$F" ] || { echo "no msix found"; find out -type f; exit 1; }
          mkdir -p artifact
          cp "$F" artifact/Mirall.msix
          ls -la artifact/

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          BUCKET: ${{ secrets.R2_BUCKET }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ARCH_PATH: ${{ matrix.archPath }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          # Every hosted runner image ships the AWS CLI; a missing one is an image
          # change to look at, not something to install unverified.
          command -v aws >/dev/null 2>&1 || { echo "::error::aws CLI is missing from the runner image"; exit 1; }
          aws --version
          if [ "$CHANNEL" = "prod" ]; then
            BASE="desktop/releases/v$VERSION"
          else
            BASE="desktop/channels/$CHANNEL"
          fi
          # Every file the locate step put in artifact/ is uploaded (a Linux row carries the
          # AppImage and the deb). R2 serves the stored contentType verbatim, and `aws s3 cp`
          # derives nothing for these extensions (Python's mimetypes knows none of them), so a bare
          # copy publishes an artifact with NO Content-Type header. Microsoft requires
          # application/msix for HTTP-delivered MSIX. An unmapped extension is a hard failure rather
          # than an octet-stream fallback: a new artifact type has to be a deliberate choice.
          for FILE in artifact/Mirall.*; do
            EXT="${FILE##*.}"
            if [ "$PLATFORM" = "win32" ]; then
              KEY="$BASE/$ARCH_PATH/unsigned/Mirall.$EXT"
            else
              KEY="$BASE/$ARCH_PATH/Mirall.$EXT"
            fi
            case "$EXT" in
              msix)     CT="application/msix" ;;
              dmg)      CT="application/x-apple-diskimage" ;;
              AppImage) CT="application/vnd.appimage" ;;
              deb)      CT="application/vnd.debian.binary-package" ;;
              *)        echo "::error::no Content-Type mapping for .$EXT"; exit 1 ;;
            esac
            echo "Uploading $FILE -> $KEY  (Content-Type: $CT)"
            if [ "$CHANNEL" = "prod" ]; then
              # A released path is written once: the PUT succeeds only when the key does not
              # exist yet, and the bucket's lock on desktop/releases/ refuses any overwrite as
              # well. A version that needs new bytes ships as the next version.
              if ! aws s3api put-object --bucket "$BUCKET" --key "$KEY" --body "$FILE" --content-type "$CT" --if-none-match '*' >/dev/null 2>"$RUNNER_TEMP/put.err"; then
                cat "$RUNNER_TEMP/put.err" >&2
                if grep -q -E 'PreconditionFailed|ObjectLockedByBucketPolicy' "$RUNNER_TEMP/put.err"; then
                  echo "::error::$KEY already exists; a released version is never rebuilt — cut the next version."
                fi
                exit 1
              fi
            else
              aws s3 cp "$FILE" "s3://$BUCKET/$KEY" --content-type "$CT"
            fi
            OBSERVED=$(aws s3api head-object --bucket "$BUCKET" --key "$KEY" \
                         --query 'ContentType' --output text)
            echo "observed=$OBSERVED expected=$CT"
            if [ "$OBSERVED" != "$CT" ]; then
              echo "::error::Content-Type mismatch on $KEY: '$OBSERVED' != '$CT'"
              exit 1
            fi
          done

      - name: Upload artifact (CI fallback)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirall-${{ matrix.archPath }}
          path: artifact/

  notify:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        shell: bash
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          if [ "$CHANNEL" = "prod" ]; then
            BASE="desktop/releases/v$VERSION"
            SIGN_ARGS="-Channel prod -Version $VERSION"
          else
            BASE="desktop/channels/$CHANNEL"
            SIGN_ARGS="-Channel $CHANNEL"
          fi
          {
            echo "## Mirall Electron build"
            echo ""
            echo "- channel: \`$CHANNEL\`"
            echo "- version: \`$VERSION\`"
            echo ""
            echo "Artifacts (R2 layout):"
            echo ""
            echo '```'
            echo "$BASE/darwin-x64/Mirall.dmg"
            echo "$BASE/darwin-arm64/Mirall.dmg"
            echo "$BASE/linux-x64/Mirall.AppImage"
            echo "$BASE/linux-x64/Mirall.deb"
            echo "$BASE/linux-arm64/Mirall.AppImage"
            echo "$BASE/linux-arm64/Mirall.deb"
            echo "$BASE/win32-x64/unsigned/Mirall.msix    # sign locally, upload to win32-x64/signed/"
            echo '```'
            echo ""
            if [ "$CHANNEL" = "prod" ]; then
              echo "Release artifacts are write-once: a failed row is recovered with *Re-run failed jobs*; anything else ships as the next version."
              echo ""
            fi
            echo "Next step (Windows): sign the MSIX out-of-band ($SIGN_ARGS; see .claude/build-process.md, Windows) and upload it to win32-x64/signed/"
          } >> "$GITHUB_STEP_SUMMARY"
