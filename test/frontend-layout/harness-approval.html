<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirall approval in-flight harness</title>
  <!-- The REAL built stylesheet, so the harness uses the app's actual CSS. -->
  <link rel="stylesheet" href="../../assets/dist/app.css" />
  <!-- One pending request + a delayed approve reply so the in-flight disable is observable. -->
  <script>
    window.__HARNESS_CFG = {
      pendingRequests: [{ publicKey: 'joiner00000000000000000000000000000000000000000000000000000000ab', displayName: 'Bob', avatar: null }],
      rpcDelayMs: 400,
      delayTypes: ['space:approve-member'],
    }
  </script>
  <!-- Classic script: installs window.bridge BEFORE the ESM bundle imports ipc.ts. -->
  <script src="./fake-bridge.js"></script>
</head>
<body style="background: var(--color-background);">
  <div id="root"></div>
  <script type="module" src="./dist/harness-approval.js"></script>
</body>
</html>
